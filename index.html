<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creator Studio - Wajid Khan</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#eef2ff;padding-bottom:80px}
.top{background:#2563eb;color:white;padding:25px 20px 30px;border-radius:0 0 25px 25px}
.top h1{font-size:28px}
.profile-card{display:flex;align-items:center;gap:12px;margin-top:15px}
.profile-card img{width:65px;height:65px;border-radius:50%;border:3px solid white;object-fit:cover}
.badge{background:#facc15;color:black;padding:8px 14px;border-radius:15px;font-weight:bold;margin-left:auto;text-align:center}
.stats{display:flex;gap:10px;padding:15px}
.stat{background:white;flex:1;text-align:center;padding:15px 5px;border-radius:15px}
.stat b{font-size:20px}
.stat p{font-size:12px;color:gray}
.btns{display:flex;gap:10px;padding:0 15px}
.btns button{flex:1;padding:12px;border:none;border-radius:12px;color:white;font-weight:bold;font-size:14px}
.blue{background:#2563eb}.red{background:#ef4444}.green{background:#22c55e}
.card{background:white;margin:15px;border-radius:18px;padding:15px}
.card h2{margin-bottom:10px;font-size:18px}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee;gap:8px}
.row:last-child{border:none}
.row button{background:#eef2ff;color:#2563eb;border:none;padding:8px 14px;border-radius:20px;font-weight:bold;white-space:nowrap}
.nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #eee;z-index:50}
.nav div{text-align:center;font-size:13px;color:gray;cursor:pointer}
.nav .active{color:#2563eb;font-weight:bold}
.page{display:none;padding:15px}
.page.active{display:block}
input,textarea,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px;font-size:15px}
.big-btn{width:100%;padding:13px;background:#2563eb;color:white;border:none;border-radius:10px;font-weight:bold;font-size:16px;margin-top:10px}
.gray-btn{background:#eee !important;color:black !important}
#loginPage{position:fixed;top:0;left:0;right:0;bottom:0;background:#2563eb;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;color:white;text-align:center}
.login-box{background:white;width:100%;max-width:380px;padding:20px;border-radius:20px;color:black;margin-top:15px}
.fb-btn{background:#1877F2;color:white;width:100%;padding:13px;border:none;border-radius:10px;font-weight:bold;font-size:16px;margin-top:10px}
.success{color:green;font-weight:bold;margin-top:10px}
.live-box{background:black;color:white;padding:30px 10px;text-align:center;border-radius:15px;margin:10px 0}
.post-item{background:#f8fafc;padding:12px;border-radius:12px;margin-top:10px}
</style>
</head>
<body>

<div id="loginPage">
  <h1>👋 Creator Studio</h1>
  <p>Earn, Create, Grow - Sab Kuch Ek Jagah</p>
  <div class="login-box">
    <h3>Welcome Back!</h3>
    <input type="text" id="userName" placeholder="Apna Naam Likho">
    <input type="text" placeholder="Phone / Email">
    <button class="fb-btn" onclick="doLogin()">f &nbsp; Continue with Facebook</button>
    <button class="big-btn" onclick="doLogin()">Login</button>
  </div>
</div>

<div id="homePage">
  <div class="top">
    <h1>👋 Salam, <span id="displayName">Wajid</span>!</h1>
    <p>Creator Studio -
